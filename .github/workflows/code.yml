name: code

on:
  push:
    branches: [main]
    paths:
      - "code/**"
      - "scripts/**"
      - ".github/workflows/code.yml"
  pull_request:
    paths:
      - "code/**"
      - "scripts/**"
      - ".github/workflows/code.yml"
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      chapters: ${{ steps.list.outputs.chapters }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          # Emit a JSON array of chapter slugs that have a maven/ subdir.
          # gradle/ parity is enforced by parity-check.sh when present.
          chapters=$(find code -mindepth 1 -maxdepth 1 -type d \
            | sort \
            | while read d; do
                slug=$(basename "$d")
                if [[ -d "$d/maven" ]]; then
                  echo "$slug"
                fi
              done \
            | jq -R . | jq -s -c .)
          echo "chapters=$chapters" >> "$GITHUB_OUTPUT"
          echo "discovered: $chapters"

  build:
    needs: discover
    if: needs.discover.outputs.chapters != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        chapter: ${{ fromJson(needs.discover.outputs.chapters) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Maven/Gradle parity
        run: scripts/parity-check.sh ${{ matrix.chapter }}

      - name: Run mvn + gradle tests
        run: scripts/verify-chapter.sh ${{ matrix.chapter }}
