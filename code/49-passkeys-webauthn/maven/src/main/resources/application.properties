spring.application.name=49-passkeys-webauthn
spring.datasource.url=jdbc:h2:mem:passkeys;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
app.passkeys.relying-party-id=localhost
app.passkeys.relying-party-name=Spring Boot 4 Passkeys
app.passkeys.allowed-origins=http://localhost:8080
app.passkeys.challenge-ttl=5m
