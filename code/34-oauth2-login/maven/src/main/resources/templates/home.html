<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>OAuth2 Login</title>
</head>
<body>
	<h1>OAuth2 Login</h1>
	<section th:if="${user == null}">
		<p><a href="/oauth2/authorization/github">Sign in with GitHub</a></p>
		<p><a href="/oauth2/authorization/google">Sign in with Google</a></p>
	</section>
	<section th:if="${user != null}">
		<p>Signed in as <strong th:text="${user.name}">user</strong>.</p>
		<p><a href="/me">View principal JSON</a></p>
		<form th:action="@{/logout}" method="post">
			<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
			<button type="submit">Sign out</button>
		</form>
	</section>
</body>
</html>
