site_name: Spring Boot 4 — Follow-Along
site_description: Comprehensive, beginner-friendly Spring Boot 4 documentation built only from SB4 idioms.
site_url: https://prkprime.dev/Spring-Boot-4-Docs-LLM-generated/
repo_url: https://github.com/prkprime/Spring-Boot-4-Docs-LLM-generated
edit_uri: edit/main/docs/
strict: true
copyright: Generated and reviewed with Claude Opus 4.7 and Codex GPT-5.5; roughly USD 400 of token/API spend.

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: green
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: light green
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye

plugins:
  - search
  - include-markdown
  - glightbox
  # Re-enable once the repo is initialized with git:
  # - git-revision-date-localized:
  #     type: timeago
  #     enable_creation_date: true
  #     fallback_to_build_date: true

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.caret

extra:
  generator: false
  spring_boot_version: "4.0.6"
  java_version: "25"

extra_css:
  - stylesheets/extra.css

